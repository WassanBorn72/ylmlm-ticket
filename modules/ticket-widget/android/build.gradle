plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'jp.ylmlm.unofficial.ticket.widget'
version = '1.0.0'
android {
  namespace 'jp.ylmlm.unofficial.ticket.widget'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}
android { testOptions { unitTests.includeAndroidResources = true } }
dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(Test).configureEach { maxHeapSize = '1g'; maxParallelForks = 1; systemProperty 'widget.preview.output', layout.buildDirectory.dir('widget-previews').get().asFile.absolutePath }
