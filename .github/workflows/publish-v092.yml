# Verify compact timetable cards after the standard-size fit correction.
name: Publish verified v0.9.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v092.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.9.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate version tag
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json")).version; if (process.env.RELEASE_TAG !== `v${version}` || JSON.parse(fs.readFileSync("app.json")).expo.version !== version) throw new Error("Tag, package.json and app.json versions must match");'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:native
      - name: Build with private release key
        env:
          YLMLM_TICKET_ANDROID_KEYSTORE_BASE64: ${{ secrets.YLMLM_TICKET_ANDROID_KEYSTORE_BASE64 }}
          YURU_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YLMLM_TICKET_ANDROID_KEYSTORE_PASSWORD }}
          YURU_ANDROID_KEY_ALIAS: ${{ secrets.YLMLM_TICKET_ANDROID_KEY_ALIAS }}
          YURU_ANDROID_KEY_PASSWORD: ${{ secrets.YLMLM_TICKET_ANDROID_KEY_PASSWORD }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -euo pipefail
          export YURU_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/yuru-release.jks"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ['YLMLM_TICKET_ANDROID_KEYSTORE_BASE64', 'YURU_ANDROID_KEYSTORE_PASSWORD', 'YURU_ANDROID_KEY_ALIAS', 'YURU_ANDROID_KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing GitHub Actions secret: {name}')
          key = Path(os.environ['YURU_ANDROID_KEYSTORE_PATH'])
          key.write_bytes(base64.b64decode(''.join(os.environ['YLMLM_TICKET_ANDROID_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          PY
          trap 'rm -f "$YURU_ANDROID_KEYSTORE_PATH"' EXIT
          npm run build:android
          apk="android/app/build/outputs/apk/release/app-release.apk"
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$verifier"
          "$verifier" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import os,re,xml.etree.ElementTree as E
          root=Path(os.environ['RUNNER_TEMP'])
          cert=(root/'apk-signature.txt').read_text().lower()
          assert 'f91cd732e14921b652df93611742a7b24ea724d44d19cb1d8593e6a4aa261552' in cert, 'Unexpected signing certificate'
          package=(root/'apk-badging.txt').read_text().splitlines()[0]
          for field,value in [('name','jp.ylmlm.unofficial.ticket'),('versionCode','29'),('versionName','0.9.2')]:
              assert re.search(r"\b"+field+r"='"+re.escape(value)+"'",package), package
          report=E.parse('modules/ticket-widget/android/build/test-results/testReleaseUnitTest/TEST-jp.ylmlm.unofficial.ticket.widget.TicketWidgetTest.xml').getroot()
          assert report.attrib['tests']=='14' and report.attrib['failures']=='0' and report.attrib['errors']=='0', report.attrib
          print('Verified existing signing certificate, app ID, version 0.9.2/code 29 and all 14 native tests')
          PYVERIFY
          mkdir -p release-artifacts
          cp "$apk" "release-artifacts/ylmlm-unofficial-ticket-${RELEASE_TAG}.apk"
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - name: Preserve widget native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-native-tests
          path: modules/ticket-widget/android/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/
          if-no-files-found: error
  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: v0.9.2
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-artifacts
      - name: Require source CI and verify downloaded APK
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=30" > "$RUNNER_TEMP/source-ci.json"
          python3 - <<'PYCI'
          import json,os
          from pathlib import Path
          runs=json.loads((Path(os.environ['RUNNER_TEMP'])/'source-ci.json').read_text())['workflow_runs']
          ci=next(r for r in runs if r['name']=='Checks')
          assert ci['conclusion']=='success',ci['html_url']
          PYCI
          (cd release-artifacts && sha256sum -c SHA256SUMS.txt)
      - name: Tag the verified source
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Create a reviewable GitHub release draft
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const values = {
            TAG: tag,
            REPO: process.env.GH_REPO,
            APK: `ylmlm-unofficial-ticket-${tag}.apk`,
          };
          const template = fs.readFileSync('docs/RELEASE_NOTES_TEMPLATE.md', 'utf8');
          const notes = template.replace(/\{\{(TAG|REPO|APK)\}\}/g, (_, key) => values[key]);
          if (/\{\{.*?\}\}/.test(notes)) throw new Error('Unresolved release note placeholder');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes);
          JS
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag --draft --title "モ！のチケット帳（非公式） ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish this authorized release and verify its public download
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v0.9.2
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh api "repos/$GH_REPO/releases/latest" --jq .tag_name | grep -Fx "$RELEASE_TAG"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/public.apk" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/ylmlm-unofficial-ticket-$RELEASE_TAG.apk"
          cmp "$RUNNER_TEMP/public.apk" "release-artifacts/ylmlm-unofficial-ticket-$RELEASE_TAG.apk"
